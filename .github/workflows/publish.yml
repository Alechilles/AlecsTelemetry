name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 1.0.3 or v1.0.3). Leave empty to use pom.xml."
        required: false
        type: string
      dry_run:
        description: "If true, validate and build without uploading to Modifold."
        required: true
        default: true
        type: boolean
      publish_modifold:
        description: "Attempt Modifold upload (ignored when dry_run=true)."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    concurrency: release-${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$pom = Get-Content -Path "pom.xml"
          $sourceVersion = "$($pom.project.version)".Trim()
          if ([string]::IsNullOrWhiteSpace($sourceVersion)) {
            throw "Unable to read the project version from pom.xml."
          }

          $requestedVersion = "${{ github.event.inputs.version }}".Trim() -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($requestedVersion)) {
            $requestedVersion = $sourceVersion
          }
          if ($requestedVersion -ne $sourceVersion) {
            throw "Version mismatch: pom.xml is '$sourceVersion', requested '$requestedVersion'."
          }

          $escapedVersion = [regex]::Escape($requestedVersion)
          $changelog = Get-Content -Path "CHANGELOG.md" -Raw
          if ($changelog -notmatch "(?m)^##\s+v?$escapedVersion(\s+-|\s*$)") {
            throw "CHANGELOG.md is missing a heading for version '$requestedVersion'."
          }

          "version=$requestedVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Resolve publish flags
        id: flags
        shell: pwsh
        run: |
          $dryRun = "${{ github.event.inputs.dry_run }}".ToLowerInvariant()
          $publishModifold = "${{ github.event.inputs.publish_modifold }}".ToLowerInvariant()
          if ($dryRun -eq "true") {
            $publishModifold = "false"
          }
          "dry_run=$dryRun" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish_modifold=$publishModifold" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and test
        id: build
        shell: pwsh
        run: |
          .\mvnw.cmd -B clean test package
          if ($LASTEXITCODE -ne 0) {
            throw "Maven build failed with exit code $LASTEXITCODE."
          }

          $version = "${{ steps.version.outputs.version }}"
          $artifactPath = Join-Path $PWD "standalone\target\Alec's Telemetry v$version.jar"
          if (-not (Test-Path -Path $artifactPath)) {
            throw "Expected standalone artifact was not found: '$artifactPath'."
          }
          if ((Get-Item -Path $artifactPath).Length -le 0) {
            throw "Standalone artifact is empty: '$artifactPath'."
          }

          $resolvedArtifactPath = (Resolve-Path -Path $artifactPath).Path
          "artifact_path=$resolvedArtifactPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $escapedVersion = [regex]::Escape($version)
          $lines = Get-Content -Path "CHANGELOG.md"
          $startIndex = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+v?$escapedVersion(\s+-|\s*$)") {
              $startIndex = $i
              break
            }
          }
          if ($startIndex -lt 0) {
            throw "Could not find changelog heading for version '$version'."
          }

          $endIndex = $lines.Count
          for ($i = $startIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+") {
              $endIndex = $i
              break
            }
          }

          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          $outputPath = Join-Path $PWD "artifacts\changelog.md"
          Set-Content -Path $outputPath -Value (($lines[$startIndex..($endIndex - 1)] -join "`n").Trim())
          $resolvedOutputPath = (Resolve-Path -Path $outputPath).Path
          "changelog_path=$resolvedOutputPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: ${{ steps.build.outputs.artifact_path }}
          if-no-files-found: error

      - name: Publish to Modifold
        if: ${{ steps.flags.outputs.publish_modifold == 'true' }}
        shell: pwsh
        env:
          MODIFOLD_API_TOKEN: ${{ secrets.MODIFOLD_API_TOKEN }}
        run: |
          .\scripts\release\publish-modifold.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -ArtifactPath "${{ steps.build.outputs.artifact_path }}" `
            -ChangelogPath "${{ steps.changelog.outputs.changelog_path }}" `
            -DryRun $false
