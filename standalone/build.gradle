import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'com.azuredoom.hytale-tools'
    id 'com.gradleup.shadow' version '9.6.1'
}

def localProperties = new Properties()
new File(project.projectDir.parentFile, 'gradle.properties').withInputStream { localProperties.load(it) }
def localProperty = { String name -> providers.gradleProperty(name).getOrElse(localProperties.getProperty(name)) }

group = 'com.alechilles'
version = localProperty('mod_version')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://www.cursemaven.com') }
}

dependencies {
    implementation project(':beacon:runtime')
    implementation "curse.maven:creditor-1560961:${localProperty('creditor_file_id')}"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

configurations.named('testImplementation') {
    extendsFrom(configurations.compileOnly)
}

hytaleTools {
    hytaleVersion = localProperty('hytale_version')
    patchline = localProperty('hytale_patchline')
    manifestServerVersion = '>=0.5.0 <0.7.0'
    manifestGroup = 'Alechilles'
    modId = 'Beacon'
    modDescription = 'Beacon — The developer platform behind ModStats.io.'
    modUrl = 'https://beacon.modstats.io'
    modCredits = 'Alec (Alechilles)||https://www.curseforge.com/members/alechilles/projects'
    mainClass = 'com.alechilles.beacon.Beacon'
    includesPack = true
    bundleAssetEditorRuntime = false
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar', ShadowJar) {
    archiveFileName = "Beacon v${project.version}.jar"
    archiveClassifier = ''
    exclude 'Common/UI/Custom/BeaconLogo.png'
    exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes('Plugin-Group': project.group, 'Plugin-Name': project.name, 'Plugin-Version': project.version)
    }
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir projectDir
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
}
